
# yml -> key : value

## Whaat is YAML?
# YAML (YAML Ain't Markup Language) is a human-readable data serialization format commonly used for configuration files and data exchange between programming languages with different data structures.


## Where to use YAML?
# Configuration files (e.g., application settings, deployment configurations)
# Data serialization (e.g., data exchange between systems)
# Infrastructure as Code (e.g., defining cloud resources)
# CI/CD pipelines (e.g., defining build and deployment workflows)
# Kubernetes manifests (e.g., defining pods, services, deployments)
# Docker Compose files (e.g., defining multi-container Docker applications)
# Ansible playbooks (e.g., defining automation tasks)


## ⁡⁢⁣⁣𝗬𝗔𝗠𝗟 𝘀𝘆𝗻𝘁𝗮𝘅 𝗯𝗮𝘀𝗶𝗰𝘀⁡
geeting: "Hello, World!" # valid
